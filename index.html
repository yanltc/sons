<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lecteur de texte</title>
    <link rel="icon" type="image/jpeg" href="son.jpg" />
  </head>
  <body>
    <h1><i><u><strong>Entrez un texte que vous allez écouter</strong></u></i></h1>

    <div class="fiel">
      
        <div class="champ">
          <input
            type="text"
            id="text"
            placeholder="Entrez le texte à lire !"
          />
          <button
            onclick="
              const utterance = new SpeechSynthesisUtterance(text.value);
              utterance.lang = 'fr-FR';
              utterance.rate = 1;
              utterance.pitch = 1;
              speechSynthesis.speak(utterance);
            "
          >
            🔊
          </button>
        </div>
    </div>

    <style>
      body {
        font-family: "Gill Sans", "Gill Sans MT", Calibri, "Trebuchet MS", sans-serif;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
        background: #c0b6ff;
      }

      h1 {
        color: #7c6af7;
        margin-bottom: 15px;
        text-align: center;
      }

      .champ {
        display: flex;
        gap: 5px;
      }

      fieldset {
        border: none;
        padding: 20px;
        width: 100%;
      }

      .fiel {
        border: 2px solid #050505;
        border-radius: 15px;
        padding: 20px;
        width: 80%;
        max-width: 800px;
      }

      input {
        font-family: "Gill Sans", "Gill Sans MT", Calibri, "Trebuchet MS", sans-serif;
        outline: none;
        width: 300px;
        padding: 10px 20px;
        border-radius: 15px;
        font-size: 14px;
        color: rgb(0, 0, 0);
        background-color: burlywood;
        border: none;
      }

      button {
        width: 300px;
        padding: 10px 20px;
        border-radius: 15px;
        font-size: 20px;
        background-color: burlywood;
        border: none;
        cursor: pointer;
      }

      button:hover {
        background-color: #dbdbdb;
      }
    </style>
  </body>
</html>
